{% include base_path %}

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="{{ base_path }}/" aria-label="He Yichen home">
      <span class="brand__mark">~/</span><span class="brand__name">mister-he.github.io</span>
    </a>
    <span class="topbar__status"><span class="status-dot"></span> research_mode: online</span>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}{% assign domain = '' %}{% else %}{% assign domain = base_path %}{% endif %}
        <a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} class="is-current"{% endif %}>{{ link.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
